name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run canonical verification
        run: npm run verify

      - name: Build verified GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PUBLIC_SITE_URL: https://hall-of-memory.github.io
        run: npm run build:pages

      - name: Bind Pages artifact to this Verify run
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SOURCE_SHA: ${{ github.sha }}
          VERIFY_RUN_ID: ${{ github.run_id }}
        run: node scripts/write-pages-deployment-receipt.mjs .pages-artifact "$SOURCE_SHA" "$VERIFY_RUN_ID"

      - name: Upload verified GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./.pages-artifact

  deploy-pages:
    name: pages-runtime
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
      statuses: write

    steps:
      - name: Checkout verified receipt validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Publish pending runtime status
        env:
          SOURCE_SHA: ${{ github.sha }}
          STATUS_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(node -e 'process.stdout.write(JSON.stringify({state:"pending",context:"pages-runtime",description:"GitHub Pages deploy/readback pending"}))')"
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $STATUS_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_SHA}"

      - name: Deploy verified artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify deployed runtime receipt
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_SHA: ${{ github.sha }}
          VERIFY_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          receipt_url="${PAGE_URL%/}/hall-of-memory-deployment.json"
          for attempt in $(seq 1 30); do
            candidate_url="${receipt_url}?source=${SOURCE_SHA}&verify_run=${VERIFY_RUN_ID}&attempt=${attempt}"
            if curl --fail --silent --show-error --location --max-time 5 \
              --header "Cache-Control: no-cache" \
              "$candidate_url" --output /tmp/hall-of-memory-deployment.json; then
              if node scripts/verify-pages-runtime-receipt.mjs /tmp/hall-of-memory-deployment.json "$SOURCE_SHA" "$VERIFY_RUN_ID"; then
                exit 0
              fi
            fi
            sleep 2
          done
          echo "Pages runtime receipt did not converge to this Verify run." >&2
          exit 1

      - name: Publish terminal runtime status
        if: always()
        env:
          SOURCE_SHA: ${{ github.sha }}
          STATUS_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          state="failure"
          description="GitHub Pages deploy/readback failed"
          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="GitHub Pages receipt matches this Verify run"
          fi
          payload="$(node -e 'const payload={state:process.argv[1],context:"pages-runtime",description:process.argv[2]};if(process.argv[3])payload.target_url=process.argv[3];process.stdout.write(JSON.stringify(payload))' "$state" "$description" "$PAGE_URL")"
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $STATUS_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_SHA}"
