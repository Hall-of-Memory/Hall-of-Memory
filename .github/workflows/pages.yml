name: Deploy GitHub Pages

on:
  workflow_run:
    workflows:
      - Verify
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build verified preview
        env:
          PUBLIC_SITE_URL: https://hall-of-memory.github.io
        run: npm run build:pages
      - name: Bind artifact to source and Verify run
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          VERIFY_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/write-pages-deployment-receipt.mjs .pages-artifact "$SOURCE_SHA" "$VERIFY_RUN_ID"
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./.pages-artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  runtime-readback:
    name: pages-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy
    permissions:
      contents: read
      statuses: write
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      VERIFY_RUN_ID: ${{ github.event.workflow_run.id }}
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout verified receipt validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Publish pending runtime status
        shell: bash
        run: |
          set -euo pipefail
          payload="$(node -e 'process.stdout.write(JSON.stringify({state:"pending",context:"pages-runtime",description:"GitHub Pages runtime readback pending",target_url:process.argv[1]}))' "$PAGE_URL")"
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_SHA}"

      - name: Verify deployed runtime receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt_url="${PAGE_URL%/}/.well-known/hall-of-memory-deployment.json"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location --max-time 10 "$receipt_url" --output /tmp/hall-of-memory-deployment.json; then
              if node scripts/verify-pages-runtime-receipt.mjs /tmp/hall-of-memory-deployment.json "$SOURCE_SHA" "$VERIFY_RUN_ID"; then
                exit 0
              fi
            fi
            sleep 2
          done
          echo "Pages runtime receipt did not converge to the verified source revision." >&2
          exit 1

      - name: Publish successful runtime status
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          payload="$(node -e 'process.stdout.write(JSON.stringify({state:"success",context:"pages-runtime",description:"GitHub Pages receipt matches verified revision",target_url:process.argv[1]}))' "$PAGE_URL")"
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_SHA}"

      - name: Publish failed runtime status
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          payload="$(node -e 'process.stdout.write(JSON.stringify({state:"failure",context:"pages-runtime",description:"GitHub Pages runtime readback failed",target_url:process.argv[1]}))' "$PAGE_URL")"
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_SHA}"
