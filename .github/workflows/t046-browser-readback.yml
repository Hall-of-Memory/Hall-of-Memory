name: T046 Browser Readback

on:
  pull_request:
    paths:
      - '.github/workflows/t046-browser-readback.yml'
      - 'scripts/t046-browser-readback.mjs'
      - 'src/**'
      - 'tasks/T046-canonical-landing-convergence.md'
      - 'tasks/INDEX.md'

permissions:
  contents: read

concurrency:
  group: t046-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared landing
        run: npm run build

      - name: Start preview and run Chrome readback
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4321 >/tmp/hom-t046-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 100); do
            if curl --fail --silent --show-error http://127.0.0.1:4321/ >/dev/null; then
              break
            fi
            if ! kill -0 "$PREVIEW_PID" 2>/dev/null; then
              cat /tmp/hom-t046-preview.log
              exit 1
            fi
            if [ "$attempt" -eq 100 ]; then
              cat /tmp/hom-t046-preview.log
              exit 1
            fi
            sleep 0.1
          done

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --version
          node scripts/t046-browser-readback.mjs "$CHROME" http://127.0.0.1:4321

      - name: Retain full-page browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t046-browser-readback-${{ github.event.pull_request.head.sha }}
          path: .t046-browser-evidence/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
